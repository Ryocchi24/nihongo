<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT 일본어 단어장</title>
<style>
  :root{
    --bg:#FFFFFF;
    --card:#F7F8FA;
    --surface:#FFFFFF;
    --text:#232326;
    --sub:#8B8D98;
    --accent:#2F5FD1;
    --accent-light:#EAF0FE;
    --correct:#1F9D55;
    --correct-bg:#E9F9EF;
    --wrong:#E0393E;
    --wrong-bg:#FDEAEA;
    --hair:#E7E8ED;
    --char:#4FAE9E;
    --char-light:#E3F5F1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --card:#1C1F27; --surface:#242732; --text:#ECEDF1; --sub:#9497A6;
      --accent:#6C8FEF; --accent-light:#202A44; --correct:#3ED07E; --correct-bg:#163425;
      --wrong:#FF6E6E; --wrong-bg:#3A1B1D; --hair:#2B2E38; --char:#5FC4B3; --char-light:#173330;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --card:#1C1F27; --surface:#242732; --text:#ECEDF1; --sub:#9497A6;
    --accent:#6C8FEF; --accent-light:#202A44; --correct:#3ED07E; --correct-bg:#163425;
    --wrong:#FF6E6E; --wrong-bg:#3A1B1D; --hair:#2B2E38; --char:#5FC4B3; --char-light:#173330;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{
    background:var(--bg); height:100%; overflow:hidden;
  }
  body{
    background:var(--bg); color:var(--text); height:100%;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:18px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:720px; margin:0 auto; padding:24px 20px 28px; }
  .brand{ font-size:15px; font-weight:700; color:var(--accent); letter-spacing:0.02em; margin-bottom:20px; }
  .card{ background:var(--card); border-radius:18px; padding:24px; margin-bottom:20px; }
  .surface{ background:var(--surface); border:1px solid var(--hair); border-radius:18px; padding:20px; margin-bottom:16px; }
  h1{ font-size:22px; margin:0 0 4px; }
  h2{ font-size:19px; margin:0 0 12px; }
  p.sub{ color:var(--sub); font-size:14px; margin:0; }
  .btn{
    display:block; width:100%; text-align:center; padding:16px; border-radius:14px;
    border:none; font-size:17px; font-weight:700; cursor:pointer; margin-top:12px;
    background:var(--accent); color:#fff; transition:opacity .15s ease-out;
  }
  .btn:active{ opacity:.8; }
  .btn.secondary{ background:var(--accent-light); color:var(--accent); }
  .btn.ghost{ background:transparent; color:var(--sub); border:1px solid var(--hair); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .row{ display:flex; gap:12px; }
  .row .btn{ margin-top:0; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .stat-box{ background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:14px; text-align:center; }
  .stat-box .num{ font-size:22px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .stat-box .label{ font-size:12px; color:var(--sub); margin-top:2px; }
  .xp-track{ height:10px; background:var(--hair); border-radius:999px; overflow:hidden; margin-top:10px; }
  .xp-fill{ height:100%; background:var(--char); border-radius:999px; transition:width .4s ease-out; }
  .char-wrap{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; }
  .char-name{ font-weight:700; margin-top:8px; }
  .choice-list{ margin-top:20px; }
  .choice-btn{
    display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:10px 16px;
    background:var(--surface); border:1px solid var(--hair); border-radius:14px; margin-bottom:8px;
    font-size:17px; text-align:left; cursor:pointer; color:var(--text); transition:background .15s ease-out;
  }
  .choice-num{
    width:26px; height:26px; border-radius:999px; background:var(--accent-light); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
  }
  .choice-btn.correct{ background:var(--correct-bg); border-color:var(--correct); }
  .choice-btn.wrong{ background:var(--wrong-bg); border-color:var(--wrong); }
  .choice-btn.correct .choice-num{ background:var(--correct); color:#fff; }
  .choice-btn.wrong .choice-num{ background:var(--wrong); color:#fff; }
  .word-jp{ font-size:26px; font-weight:800; margin:4px 0; overflow-wrap:break-word; }
  .word-pos{ display:inline-block; font-size:12px; color:var(--accent); background:var(--accent-light); padding:2px 8px; border-radius:999px; margin-bottom:8px; }
  .word-meaning{ font-size:20px; font-weight:700; margin:6px 0; }
  .example-box{ background:var(--surface); border:1px solid var(--hair); border-radius:14px; padding:12px 14px; margin-top:12px; }
  .example-jp{ font-size:16px; margin-bottom:4px; line-height:2; }
  .example-jp rt{ font-size:10px; color:var(--sub); user-select:none; }
  .example-ko{ font-size:14px; color:var(--sub); }
  .feedback-banner{ margin-top:16px; padding:14px 16px; border-radius:14px; font-weight:700; }
  .feedback-banner.correct{ background:var(--correct-bg); color:var(--correct); }
  .feedback-banner.wrong{ background:var(--wrong-bg); color:var(--wrong); }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .icon-btn{ background:none; border:none; color:var(--sub); font-size:22px; cursor:pointer; padding:4px 8px; }
  .pause-btn{
    display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--hair);
    border-radius:999px; padding:8px 16px; font-size:14px; font-weight:700; color:var(--sub); cursor:pointer;
  }
  .pause-btn:active{ opacity:.7; }
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .progress-label{ font-size:13px; color:var(--sub); white-space:nowrap; }
  @keyframes popIn{ 0%{transform:scale(.6); opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1); opacity:1;} }
  .pop{ animation:popIn .5s ease-out; }
  .empty-state{ text-align:center; color:var(--sub); padding:40px 20px; }
  .star-row{ display:flex; gap:6px; margin-top:12px; }
  .fixed-footer{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--bg); border-top:1px solid var(--hair);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .fixed-footer-inner{ max-width:680px; margin:0 auto; }
  .fixed-footer .btn{ margin-top:0; }
  .footer-spacer{ height:88px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== DATA =====================
   JLPT N3〜N2レベルの日本語語彙500語。品詞・意味(韓国語)・例文はオリジナル作成。
*/
const WORDS = [
  {id:1, jp:"確認する(かくにんする)", pos:"동사", meaning:"확인하다", ex_jp:"<ruby>予約<rt>よやく</rt></ruby>の<ruby>内容<rt>ないよう</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>してください。", ex_ko:"예약 내용을 확인해 주세요."},
  {id:2, jp:"発見する(はっけんする)", pos:"동사", meaning:"발견하다", ex_jp:"<ruby>新<rt>あたら</rt></ruby>しい<ruby>遺跡<rt>いせき</rt></ruby>が<ruby>発見<rt>はっけん</rt></ruby>された。", ex_ko:"새로운 유적이 발견되었다."},
  {id:3, jp:"予想する(よそうする)", pos:"동사", meaning:"예상하다", ex_jp:"<ruby>結果<rt>けっか</rt></ruby>を<ruby>予想<rt>よそう</rt></ruby>するのは<ruby>難<rt>むずか</rt></ruby>しい。", ex_ko:"결과를 예상하기는 어렵다."},
  {id:4, jp:"我慢する(がまんする)", pos:"동사", meaning:"참다", ex_jp:"<ruby>痛<rt>いた</rt></ruby>みを<ruby>我慢<rt>がまん</rt></ruby>して<ruby>最後<rt>さいご</rt></ruby>まで<ruby>走<rt>はし</rt></ruby>った。", ex_ko:"통증을 참고 끝까지 달렸다."},
  {id:5, jp:"慣れる(なれる)", pos:"동사", meaning:"익숙해지다", ex_jp:"<ruby>新<rt>あたら</rt></ruby>しい<ruby>仕事<rt>しごと</rt></ruby>にだいぶ<ruby>慣<rt>な</rt></ruby>れてきた。", ex_ko:"새 일에 많이 익숙해졌다."},
  {id:6, jp:"調査する(ちょうさする)", pos:"동사", meaning:"조사하다", ex_jp:"<ruby>原因<rt>げんいん</rt></ruby>を<ruby>詳<rt>くわ</rt></ruby>しく<ruby>調査<rt>ちょうさ</rt></ruby>している。", ex_ko:"원인을 자세히 조사하고 있다."},
  {id:7, jp:"反映する(はんえいする)", pos:"동사", meaning:"반영하다", ex_jp:"<ruby>意見<rt>いけん</rt></ruby>を<ruby>反映<rt>はんえい</rt></ruby>して<ruby>計画<rt>けいかく</rt></ruby>を<ruby>修正<rt>しゅうせい</rt></ruby>した。", ex_ko:"의견을 반영해서 계획을 수정했다."},
  {id:8, jp:"向上する(こうじょうする)", pos:"동사", meaning:"향상되다", ex_jp:"<ruby>練習<rt>れんしゅう</rt></ruby>のおかげで<ruby>技術<rt>ぎじゅつ</rt></ruby>が<ruby>向上<rt>こうじょう</rt></ruby>した。", ex_ko:"연습 덕분에 기술이 향상되었다."},
  {id:9, jp:"改善する(かいぜんする)", pos:"동사", meaning:"개선하다", ex_jp:"サービスの<ruby>質<rt>しつ</rt></ruby>を<ruby>改善<rt>かいぜん</rt></ruby>する<ruby>必要<rt>ひつよう</rt></ruby>がある。", ex_ko:"서비스 질을 개선할 필요가 있다."},
  {id:10, jp:"検討する(けんとうする)", pos:"동사", meaning:"검토하다", ex_jp:"<ruby>提案<rt>ていあん</rt></ruby>の<ruby>内容<rt>ないよう</rt></ruby>を<ruby>検討<rt>けんとう</rt></ruby>しています。", ex_ko:"제안 내용을 검토하고 있습니다."},
  {id:11, jp:"提出する(ていしゅつする)", pos:"동사", meaning:"제출하다", ex_jp:"<ruby>明日<rt>あした</rt></ruby>までにレポートを<ruby>提出<rt>ていしゅつ</rt></ruby>してください。", ex_ko:"내일까지 리포트를 제출해 주세요."},
  {id:12, jp:"達成する(たっせいする)", pos:"동사", meaning:"달성하다", ex_jp:"<ruby>目標<rt>もくひょう</rt></ruby>をついに<ruby>達成<rt>たっせい</rt></ruby>した。", ex_ko:"목표를 마침내 달성했다."},
  {id:13, jp:"解決する(かいけつする)", pos:"동사", meaning:"해결하다", ex_jp:"<ruby>問題<rt>もんだい</rt></ruby>は<ruby>思<rt>おも</rt></ruby>ったより<ruby>早<rt>はや</rt></ruby>く<ruby>解決<rt>かいけつ</rt></ruby>した。", ex_ko:"문제는 생각보다 빨리 해결되었다."},
  {id:14, jp:"説明する(せつめいする)", pos:"동사", meaning:"설명하다", ex_jp:"<ruby>手順<rt>てじゅん</rt></ruby>を<ruby>丁寧<rt>ていねい</rt></ruby>に<ruby>説明<rt>せつめい</rt></ruby>してもらった。", ex_ko:"절차를 자세히 설명받았다."},
  {id:15, jp:"準備する(じゅんびする)", pos:"동사", meaning:"준비하다", ex_jp:"<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>準備<rt>じゅんび</rt></ruby>はもう<ruby>終<rt>お</rt></ruby>わった。", ex_ko:"여행 준비는 이미 끝났다."},
  {id:16, jp:"注意する(ちゅういする)", pos:"동사", meaning:"주의하다", ex_jp:"<ruby>車<rt>くるま</rt></ruby>の<ruby>運転<rt>うんてん</rt></ruby>には<ruby>十分<rt>じゅうぶん</rt></ruby><ruby>注意<rt>ちゅうい</rt></ruby>してください。", ex_ko:"운전할 때는 충분히 주의해 주세요."},
  {id:17, jp:"続ける(つづける)", pos:"동사", meaning:"계속하다", ex_jp:"<ruby>毎日<rt>まいにち</rt></ruby><ruby>運動<rt>うんどう</rt></ruby>を<ruby>続<rt>つづ</rt></ruby>けている。", ex_ko:"매일 운동을 계속하고 있다."},
  {id:18, jp:"決める(きめる)", pos:"동사", meaning:"정하다", ex_jp:"<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>日程<rt>にってい</rt></ruby>を<ruby>決<rt>き</rt></ruby>めた。", ex_ko:"여행 일정을 정했다."},
  {id:19, jp:"選ぶ(えらぶ)", pos:"동사", meaning:"고르다", ex_jp:"<ruby>好<rt>す</rt></ruby>きな<ruby>色<rt>いろ</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。", ex_ko:"좋아하는 색을 골라 주세요."},
  {id:20, jp:"伝える(つたえる)", pos:"동사", meaning:"전하다", ex_jp:"<ruby>感謝<rt>かんしゃ</rt></ruby>の<ruby>気持<rt>きも</rt></ruby>ちを<ruby>伝<rt>つた</rt></ruby>えたい。", ex_ko:"감사한 마음을 전하고 싶다."},
  {id:21, jp:"感じる(かんじる)", pos:"동사", meaning:"느끼다", ex_jp:"<ruby>最近<rt>さいきん</rt></ruby>、<ruby>季節<rt>きせつ</rt></ruby>の<ruby>変化<rt>へんか</rt></ruby>を<ruby>感<rt>かん</rt></ruby>じる。", ex_ko:"요즘 계절의 변화를 느낀다."},
  {id:22, jp:"支える(ささえる)", pos:"동사", meaning:"지탱하다", ex_jp:"<ruby>家族<rt>かぞく</rt></ruby>が<ruby>私<rt>わたし</rt></ruby>を<ruby>支<rt>ささ</rt></ruby>えてくれた。", ex_ko:"가족이 나를 지탱해 주었다."},
  {id:23, jp:"従う(したがう)", pos:"동사", meaning:"따르다", ex_jp:"<ruby>指示<rt>しじ</rt></ruby>に<ruby>従<rt>したが</rt></ruby>って<ruby>作業<rt>さぎょう</rt></ruby>を<ruby>進<rt>すす</rt></ruby>めた。", ex_ko:"지시에 따라 작업을 진행했다."},
  {id:24, jp:"防ぐ(ふせぐ)", pos:"동사", meaning:"막다", ex_jp:"<ruby>事故<rt>じこ</rt></ruby>を<ruby>防<rt>ふせ</rt></ruby>ぐために<ruby>対策<rt>たいさく</rt></ruby>を<ruby>立<rt>た</rt></ruby>てた。", ex_ko:"사고를 막기 위해 대책을 세웠다."},
  {id:25, jp:"間に合う(まにあう)", pos:"동사", meaning:"시간에 맞추다", ex_jp:"<ruby>急<rt>いそ</rt></ruby>いだので<ruby>終電<rt>しゅうでん</rt></ruby>に<ruby>間に合<rt>まにあ</rt></ruby>った。", ex_ko:"서둘러서 막차 시간에 맞췄다."},
  {id:26, jp:"諦める(あきらめる)", pos:"동사", meaning:"포기하다", ex_jp:"<ruby>最後<rt>さいご</rt></ruby>まで<ruby>諦<rt>あきら</rt></ruby>めずに<ruby>頑張<rt>がんば</rt></ruby>った。", ex_ko:"끝까지 포기하지 않고 노력했다."},
  {id:27, jp:"恐れる(おそれる)", pos:"동사", meaning:"두려워하다", ex_jp:"<ruby>失敗<rt>しっぱい</rt></ruby>を<ruby>恐<rt>おそ</rt></ruby>れずに<ruby>挑戦<rt>ちょうせん</rt></ruby>してみよう。", ex_ko:"실패를 두려워하지 말고 도전해 보자."},
  {id:28, jp:"疑う(うたがう)", pos:"동사", meaning:"의심하다", ex_jp:"<ruby>彼<rt>かれ</rt></ruby>の<ruby>話<rt>はなし</rt></ruby>を<ruby>疑<rt>うたが</rt></ruby>う<ruby>理由<rt>りゆう</rt></ruby>はなかった。", ex_ko:"그의 말을 의심할 이유는 없었다."},
  {id:29, jp:"優れる(すぐれる)", pos:"동사", meaning:"뛰어나다", ex_jp:"この<ruby>製品<rt>せいひん</rt></ruby>は<ruby>性能<rt>せいのう</rt></ruby>が<ruby>優<rt>すぐ</rt></ruby>れている。", ex_ko:"이 제품은 성능이 뛰어나다."},
  {id:30, jp:"目立つ(めだつ)", pos:"동사", meaning:"눈에 띄다", ex_jp:"<ruby>彼女<rt>かのじょ</rt></ruby>は<ruby>人混<rt>ひとご</rt></ruby>みの<ruby>中<rt>なか</rt></ruby>でも<ruby>目立<rt>めだ</rt></ruby>つ。", ex_ko:"그녀는 사람 많은 곳에서도 눈에 띈다."},
  {id:31, jp:"見つかる(みつかる)", pos:"동사", meaning:"발견되다", ex_jp:"<ruby>探<rt>さが</rt></ruby>していた<ruby>鍵<rt>かぎ</rt></ruby>がようやく<ruby>見<rt>み</rt></ruby>つかった。", ex_ko:"찾던 열쇠를 마침내 발견했다."},
  {id:32, jp:"通じる(つうじる)", pos:"동사", meaning:"통하다", ex_jp:"<ruby>言葉<rt>ことば</rt></ruby>が<ruby>通<rt>つう</rt></ruby>じなくても<ruby>気持<rt>きも</rt></ruby>ちは<ruby>伝<rt>つた</rt></ruby>わった。", ex_ko:"말이 통하지 않아도 마음은 전해졌다."},
  {id:33, jp:"含む(ふくむ)", pos:"동사", meaning:"포함하다", ex_jp:"<ruby>税<rt>ぜい</rt></ruby>を<ruby>含<rt>ふく</rt></ruby>む<ruby>金額<rt>きんがく</rt></ruby>を<ruby>表示<rt>ひょうじ</rt></ruby>している。", ex_ko:"세금을 포함한 금액을 표시하고 있다."},
  {id:34, jp:"限る(かぎる)", pos:"동사", meaning:"제한하다", ex_jp:"<ruby>参加<rt>さんか</rt></ruby><ruby>者<rt>しゃ</rt></ruby>を<ruby>十<rt>じゅう</rt></ruby><ruby>人<rt>にん</rt></ruby>に<ruby>限<rt>かぎ</rt></ruby>ることにした。", ex_ko:"참가자를 열 명으로 제한하기로 했다."},
  {id:35, jp:"欠ける(かける)", pos:"동사", meaning:"부족하다", ex_jp:"この<ruby>計画<rt>けいかく</rt></ruby>には<ruby>現実<rt>げんじつ</rt></ruby><ruby>性<rt>せい</rt></ruby>が<ruby>欠<rt>か</rt></ruby>けている。", ex_ko:"이 계획은 현실성이 부족하다."},
  {id:36, jp:"補う(おぎなう)", pos:"동사", meaning:"보충하다", ex_jp:"<ruby>睡眠<rt>すいみん</rt></ruby><ruby>不足<rt>ふそく</rt></ruby>を<ruby>昼寝<rt>ひるね</rt></ruby>で<ruby>補<rt>おぎな</rt></ruby>った。", ex_ko:"수면 부족을 낮잠으로 보충했다."},
  {id:37, jp:"揃う(そろう)", pos:"동사", meaning:"갖추어지다", ex_jp:"<ruby>必要<rt>ひつよう</rt></ruby>な<ruby>書類<rt>しょるい</rt></ruby>がようやく<ruby>揃<rt>そろ</rt></ruby>った。", ex_ko:"필요한 서류가 마침내 갖추어졌다."},

const WORD_MAP = Object.fromEntries(WORDS.map(w => [w.id, w]));

/* ===================== STATE ===================== */
const STORAGE_KEY = "jlptVocabState_v1";
const MASTERY_THRESHOLD = 3; // 연속 정답으로 마스터 완료 처리

function defaultState(){
  return {
    today: { date: null, practiced: 0, correct: 0, masteredToday: 0 },
    celebrationShown: false, // 전체 마스터 히든 연출을 이미 보여줬는지 여부
    totalStars: 0, // 누적 ⭐️ 개수(캐릭터 진화 게이지, 한번 쌓이면 줄어들지 않음)
    cards: {} // wordId -> { correctCount, mastered }
  };
}
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      today: Object.assign(defaultState().today, parsed.today || {}),
      cards: parsed.cards || {}
    });
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* localStorage를 사용할 수 없는 환경에서는 메모리 상태로만 계속 진행 */ }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ensureDailyReset(){
  const t = todayStr();
  if(state.today.date !== t){
    state.today = { date: t, practiced: 0, correct: 0, masteredToday: 0 };
  }
}

/* ===================== 캐릭터 성장(⭐️ 누적 개수와 연동) =====================
   1번 정답을 맞힐 때마다(⭐️1개) 진화 게이지가 채워진다. 500개×3⭐️=1500⭐️를 5단계로 나눠
   계란(stage0) + 사진 캐릭터 4단계(stage1〜4)로 구성.
*/
const TOTAL_WORD_TARGET = 500;
const TOTAL_STARS_TARGET = TOTAL_WORD_TARGET * MASTERY_THRESHOLD; // 1500
const MAX_STAGE = 4; // 계란+4단계=5캐릭터
const EVOLUTION_INTERVAL = TOTAL_STARS_TARGET / (MAX_STAGE + 1); // ⭐️300개마다 진화
function characterStage(totalStars){
  return Math.min(MAX_STAGE, Math.floor(totalStars / EVOLUTION_INTERVAL));
}
const STAGE_NAMES = ["계란", "계란타쿠미", "양머리타쿠미", "골퍼타쿠미", "근육타쿠미"];
function characterStageLabel(stage){
  return STAGE_NAMES[stage] || STAGE_NAMES[STAGE_NAMES.length-1];
}

/* ===================== 마스터 판정 =====================
   4지선다에 연속으로 정답을 맞힌 횟수를 세어 MASTERY_THRESHOLD회가 되면
   「마스터 완료 풀」로 이동. 오답을 고르면 연속 카운트가 0으로 초기화된다.
*/
function newCardData(){
  return { correctCount:0, mastered:false };
}
function getCard(wordId){
  if(!state.cards[wordId]) state.cards[wordId] = newCardData();
  return state.cards[wordId];
}
function answerWord(wordId, correct){
  const c = getCard(wordId);
  if(correct){
    c.correctCount += 1;
    if(!c.mastered && c.correctCount >= MASTERY_THRESHOLD){
      c.mastered = true;
      return true; // 이 시점에 마스터에 도달함
    }
  } else {
    c.correctCount = 0;
  }
  return false;
}
function dropBackToPool(wordId){
  // 복습에 실패한 단어는 학습 중 풀로 되돌린다
  state.cards[wordId] = newCardData();
}
function getMasteredWordIds(){
  return WORDS.filter(w => getCard(w.id).mastered).map(w => w.id);
}
function getUnmasteredWordIds(){
  return WORDS.filter(w => !getCard(w.id).mastered).map(w => w.id);
}

/* ===================== UTIL ===================== */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickDistractors(correctWord, n){
  // 품사가 같은 단어를 우선적으로 골라 헷갈리게 출제한다(동사면 동사끼리, 명사면 명사끼리)
  const others = WORDS.filter(w => w.id !== correctWord.id);
  const samePos = shuffle(others.filter(w => w.pos === correctWord.pos));
  const rest = shuffle(others.filter(w => w.pos !== correctWord.pos));
  return [...samePos, ...rest].slice(0, n);
}
function starSVG(filled, animate){
  const color = filled ? "var(--char)" : "var(--hair)";
  return `<svg class="${animate ? "pop" : ""}" width="26" height="26" viewBox="0 0 24 24"><path d="M12 2 L14.9 8.6 L22 9.3 L16.5 14.1 L18.2 21 L12 17.3 L5.8 21 L7.5 14.1 L2 9.3 L9.1 8.6 Z" fill="${color}"/></svg>`;
}
function renderStars(count, total, animateLast){
  let html = '<div class="star-row">';
  for(let i=0;i<total;i++){
    html += starSVG(i < count, animateLast && i === count-1);
  }
  return html + '</div>';
}

function renderCharacterSVG(stage, size){
  size = size || 120;
  const bodyColor = "var(--char)";
  const bgColor = "var(--char-light)";

  if(stage === 0){
    return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="54" fill="${bgColor}"/>
      <ellipse cx="60" cy="68" rx="30" ry="26" fill="${bodyColor}"/>
      <path d="M60 42 Q52 30 60 22 Q68 30 60 42Z" fill="${bodyColor}"/>
      <circle cx="50" cy="66" r="3" fill="var(--surface)"/>
      <circle cx="70" cy="66" r="3" fill="var(--surface)"/>
    </svg>`;
  }

  const src = CHARACTER_PHOTOS[stage];
  return `<img src="${src}" alt="Lv.${stage}" width="${size}" height="${size}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--char-light);">`;
}

/* ===================== VIEW STATE ===================== */
let view = "home";
let session = null; // { mode:'learn'|'review', queue:[wordId,...], idx, answered, correct, newlyMastered, droppedBack }

const app = document.getElementById("app");
function render(){
  ensureDailyReset();
  if(view === "home") return renderHome();
  if(view === "practice") return renderPracticeCard();
  if(view === "sessionEnd") return renderSessionEnd();
  if(view === "celebration") return renderCelebration();
}

/* ===================== HOME ===================== */
function renderHome(){
  const masteredCount = getMasteredWordIds().length;
  const realUnmasteredCount = getUnmasteredWordIds().length;
  const displayRemaining = Math.max(0, TOTAL_WORD_TARGET - masteredCount);
  const totalStars = state.totalStars || 0;
  const stage = characterStage(totalStars);
  const isMaxStage = stage >= MAX_STAGE;
  const remainingToNext = isMaxStage ? 0 : Math.max(0, (stage+1)*EVOLUTION_INTERVAL - totalStars);
  const pctWithinStage = isMaxStage ? 100 : Math.round(100 * (totalStars % EVOLUTION_INTERVAL) / EVOLUTION_INTERVAL);

  // 진화가 최대치에 도달하면 게이지 표시를 「500개 정복까지」로 전환해 목표를 남긴다
  const gaugePct = isMaxStage ? Math.round(100 * masteredCount / TOTAL_WORD_TARGET) : pctWithinStage;
  const gaugeLabel = isMaxStage
    ? (masteredCount >= TOTAL_WORD_TARGET ? "🏆 전체 500개 정복!" : `500개 정복까지 ${TOTAL_WORD_TARGET - masteredCount}개 남음`)
    : (remainingToNext>0 ? `다음 진화까지 ⭐️${remainingToNext}개 남음` : "최대 진화 달성!");

  const milestones = [100,200,300,400,500];
  const badgeRow = milestones.map(m => {
    const unlocked = masteredCount >= m;
    const style = unlocked ? "opacity:1; filter:none;" : "opacity:.35; filter:grayscale(100%);";
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <span style="font-size:22px; ${style}">🏆</span>
      <span style="font-size:11px; color:var(--sub);">${m}개</span>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="brand">JLPT 단어장</div>
    <div class="surface">
      <div class="char-wrap">
        ${renderCharacterSVG(stage, 120)}
        <div class="char-name">${characterStageLabel(stage)}</div>
        <div class="xp-track" style="width:200px;"><div class="xp-fill" style="width:${gaugePct}%"></div></div>
        <p class="sub" style="margin-top:6px;">${gaugeLabel}</p>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${state.today.correct}</div><div class="label">오늘의 정답 수</div></div>
        <div class="stat-box"><div class="num">${masteredCount}개</div><div class="label">마스터 완료</div></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:16px; padding-top:16px; border-top:1px solid var(--hair);">
        ${badgeRow}
      </div>
    </div>

    <div class="card">
      <h2>단어 학습</h2>
      <p class="sub">4지선다에서 ${MASTERY_THRESHOLD}번 연속 정답을 맞히면 마스터 완료돼요.</p>
      <button class="btn" id="btnLearn" ${displayRemaining === 0 ? "disabled" : ""}>단어 학습하기 ${displayRemaining>0 ? `(남은 ${displayRemaining}개)` : ""}</button>
    </div>

    <div class="card">
      <h2>복습</h2>
      <p class="sub">마스터한 단어를 가볍게 복습해요. 틀리면 학습 중 풀로 다시 돌아가요.</p>
      <button class="btn secondary" id="btnReview" ${masteredCount === 0 ? "disabled" : ""}>복습하기 ${masteredCount>0 ? `(${masteredCount}개)` : ""}</button>
    </div>

    ${displayRemaining === 0 ? `<div class="empty-state">모든 단어를 마스터했어요! 🎉</div>` : ""}
  `;
  document.getElementById("btnLearn").onclick = () => { if(realUnmasteredCount>0) startSession("learn"); };
  document.getElementById("btnReview").onclick = () => { if(masteredCount>0) startSession("review"); };
}

/* ===================== PRACTICE (4지선다・탭하면 바로 시작, 언제든 이탈 가능) ===================== */
function startSession(mode){
  const pool = mode === "learn" ? getUnmasteredWordIds() : getMasteredWordIds();
  const ids = shuffle(pool);
  if(ids.length === 0){ view = "home"; render(); return; }
  session = { mode, queue: ids, idx:0, answered:0, correct:0, newlyMastered:0, droppedBack:0 };
  view = "practice";
  render();
}
function exitSession(){
  if(session && session.answered > 0){ finishSession(); }
  else { session = null; view = "home"; render(); }
}
function renderPracticeCard(){
  if(session.idx >= session.queue.length){ finishSession(); return; }
  const wordId = session.queue[session.idx];
  const w = WORD_MAP[wordId];
  const c = getCard(wordId);
  const distractors = pickDistractors(w, 3);
  const options = shuffle([w, ...distractors]);
  const isLearn = session.mode === "learn";

  app.innerHTML = `
    ${topBar(session.idx)}
    <div class="surface">
      <span class="word-pos">${w.pos}</span>
      <div class="word-jp">${escapeHtml(w.jp)}</div>
      <p class="sub" id="questionLine">뜻은 무엇일까요?</p>
      ${isLearn ? `<div id="starRow">${renderStars(c.correctCount, MASTERY_THRESHOLD, false)}</div>` : ""}
    </div>
    <div class="choice-list" id="choices">
      ${options.map((o,i) => `
        <button class="choice-btn" data-id="${o.id}">
          <span class="choice-num">${i+1}</span><span>${escapeHtml(o.meaning)}</span>
        </button>`).join("")}
    </div>
    <div id="feedbackArea"></div>
  `;
  document.querySelectorAll("#choices .choice-btn").forEach(btn => {
    btn.onclick = () => {
      if(session.locked) return;
      session.locked = true;
      const correct = Number(btn.dataset.id) === w.id;
      document.querySelectorAll("#choices .choice-btn").forEach(b => {
        const bid = Number(b.dataset.id);
        if(bid === w.id) b.classList.add("correct");
        else if(b === btn) b.classList.add("wrong");
      });

      let msg;
      session.answered += 1;
      if(isLearn){
        const justMastered = answerWord(w.id, correct);
        if(correct){ session.correct += 1; state.totalStars += 1; state.today.correct += 1; }
        if(justMastered) session.newlyMastered += 1;
        state.today.practiced += 1;
        if(justMastered) state.today.masteredToday += 1;
        const c2 = getCard(w.id);
        if(justMastered) msg = "정답! 🎉 마스터했어요!";
        else if(correct) msg = "정답!";
        else msg = "오답. 정답은 「"+escapeHtml(w.meaning)+"」예요";
        document.getElementById("starRow").innerHTML = renderStars(c2.correctCount, MASTERY_THRESHOLD, correct);
      } else {
        state.today.practiced += 1;
        if(correct){
          session.correct += 1;
          state.today.correct += 1;
          msg = "정답!";
        } else {
          dropBackToPool(w.id);
          session.droppedBack += 1;
          msg = "오답. 이 단어는 학습 중 풀로 돌아갔어요.";
        }
      }
      saveState();

      document.getElementById("questionLine").innerHTML =
        `<span style="color:${correct?"var(--correct)":"var(--wrong)"}; font-weight:700;">${msg}</span>`;
      document.getElementById("feedbackArea").innerHTML = `
        <div class="example-box">
          <div class="example-jp">${w.ex_jp}</div>
          <div class="example-ko">${escapeHtml(w.ex_ko)}</div>
        </div>
        <div class="footer-spacer"></div>
      `;
      document.getElementById("app").insertAdjacentHTML("beforeend", `
        <div class="fixed-footer"><div class="fixed-footer-inner">
          <button class="btn" id="btnAdvance">다음</button>
        </div></div>
      `);
      document.getElementById("btnAdvance").onclick = () => {
        session.idx += 1; session.locked = false;
        renderPracticeCard();
      };
    };
  });
}

/* ===================== SESSION END ===================== */
function finishSession(){
  const masteredCount = getMasteredWordIds().length;
  if(!state.celebrationShown && masteredCount >= TOTAL_WORD_TARGET){
    state.celebrationShown = true;
    saveState();
    view = "celebration";
    render();
    return;
  }
  view = "sessionEnd";
  render();
}

/* ===================== 히든 연출: 전체 마스터 ===================== */
function renderCelebration(){
  app.innerHTML = `
    <div class="surface" style="padding:0; overflow:hidden; position:relative;">
      <img src="${CELEBRATION_IMAGE}" style="width:100%; display:block;">
      <div style="position:absolute; left:0; right:0; bottom:0; padding:28px 24px; background:linear-gradient(to top, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0));">
        <div style="color:#FFD76A; font-weight:700; font-size:16px; letter-spacing:.04em;">🎉 전체 ${TOTAL_WORD_TARGET}개 단어 마스터 달성 🎉</div>
        <h1 style="color:#fff; margin:10px 0 8px; font-size:30px; line-height:1.3; text-wrap:balance;">여기까지 오느라 정말 고생 많았어!</h1>
        <p style="color:#fff; font-size:19px; line-height:1.4; margin:0; opacity:.95;">이제 너는 틀림없이 JLPT 합격이야!</p>
      </div>
    </div>
    <button class="btn" id="btnCelebContinue">홈으로 돌아가기</button>
  `;
  document.getElementById("btnCelebContinue").onclick = () => { session = null; view = "home"; render(); };
}
function renderSessionEnd(){
  const total = session.answered;
  const isLearn = session.mode === "learn";
  app.innerHTML = `
    <div class="surface" style="text-align:center;">
      <div class="pop" style="font-size:48px;">🎉</div>
      <h1>세션 완료</h1>
      <p class="sub">${total}문제 풀었어요</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${session.correct}/${total}</div><div class="label">정답</div></div>
        ${isLearn
          ? `<div class="stat-box"><div class="num">${session.newlyMastered}개</div><div class="label">새로 마스터</div></div>`
          : `<div class="stat-box"><div class="num">${session.droppedBack}개</div><div class="label">풀로 돌아감</div></div>`}
      </div>
    </div>
    <button class="btn" id="btnHome">홈으로 돌아가기</button>
  `;
  document.getElementById("btnHome").onclick = () => { session = null; view = "home"; render(); };
}

/* ===================== SHARED UI PARTS ===================== */
function topBar(idx){
  return `
    <div class="progress-row">
      <button class="pause-btn" onclick="exitSession()">⏸ 잠시 쉬기</button>
      <div class="progress-label" style="flex:1; text-align:right;">${idx+1}번째 문제</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
